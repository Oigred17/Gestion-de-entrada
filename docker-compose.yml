services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cobao
      POSTGRES_PASSWORD: cobao_pass
      POSTGRES_DB: cobao_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend_Proy_Cobao/bd_COBAO.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobao -d cobao_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: true
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cobao:cobao_pass@db:5432/cobao_db
    env_file:
      - .env
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /var/run/pcscd:/var/run/pcscd
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
