services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobao_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cobao_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd_COBAO.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobao} -d ${POSTGRES_DB:-cobao_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cobao}:${POSTGRES_PASSWORD:-cobao_pass}@db:5432/${POSTGRES_DB:-cobao_db}
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
